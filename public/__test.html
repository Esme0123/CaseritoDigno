<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #faf9f6;
      }
      iframe {
        width: 100%;
        height: 1600px;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" src="/"></iframe>
    <script>
      const frame = document.getElementById('frame')
      frame.addEventListener('load', () => {
        setTimeout(() => {
          const doc = frame.contentDocument
          doc.documentElement.style.scrollBehavior = 'auto'
          doc.getElementById('difundir')?.scrollIntoView({ behavior: 'auto', block: 'start' })
          setTimeout(() => {
            const buttons = Array.from(doc.querySelectorAll('button'))
            const target = buttons.find((button) =>
              button.textContent.includes('Descargar Imagen PNG'),
            )
            target?.click()
          }, 800)
        }, 1500)
      })
    </script>
  </body>
</html>
